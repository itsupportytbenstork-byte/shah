/* ---------- dashboard helpers ---------- */
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function series(n,offset=0){
  const out=[],now=new Date();now.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i-offset);out.push({k:dayKey(d),label:d.toLocaleDateString('en',{month:'short',day:'numeric'}),rev:0,n:0})}
  const idx={};out.forEach(x=>idx[x.k]=x);
  D.orders.filter(o=>o.status!='Cancelled'&&!o.refunded).forEach(o=>{const x=idx[dayKey(o.date)];if(x){x.rev+=+o.total||0;x.n++}});
  return out;
}
const sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
function deltaH(cur,prev){
  const p=prev?(cur-prev)/prev*100:(cur?100:0),c=Math.abs(p)<.5?'flat':p>0?'up':'down';
  return `<span class="delta ${c}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p).toFixed(0)}% vs last week</span>`;
}
function areaChart(s){
  const W=640,H=190,pl=10,pr=10,pt=14,pb=24,max=Math.max(...s.map(x=>x.rev),1),step=(W-pl-pr)/Math.max(s.length-1,1);
  const pts=s.map((x,i)=>[pl+i*step,pt+(H-pt-pb)*(1-x.rev/max)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`,every=Math.ceil(s.length/7);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B87333" stop-opacity=".35"/><stop offset="1" stop-color="#B87333" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>{const y=pt+(H-pt-pb)*f;return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eee"/>`}).join('')}
  <path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#B87333" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#B87333" stroke-width="2"><title>${s[i].label}: ${money(s[i].rev)} (${s[i].n} orders)</title></circle>`).join('')}
  ${s.map((x,i)=>i%every==0?`<text x="${pts[i][0]}" y="${H-6}" text-anchor="middle" font-size="10" fill="#999">${x.label}</text>`:'').join('')}</svg>`;
}

let dTimer=null;

      <div class="lbl2"><span>Description</span><small id="de-count">${p.desc.length} chars</small></div>
      <textarea rows="7" placeholder="Material, fit, lining, care instructions…" oninput="fld('desc',this.value)" style="line-height:1.6">${esc(p.desc)}</textarea></div>
    <div class="c"><div class="sec-h"><span class="num">3</span><div><h3>Tags</h3><p>Up to 13 tags help shoppers find this jacket in search.</p></div></div><div id="tags-sec">${tagsH()}</div></div>
    <div class="c"><div class="sec-h"><span class="num">4</span><div><h3>Price & sizes</h3><p>Set your price in USD and the sizes you stock.</p></div></div>
      <div class="lbl2"><span>Price (USD)</span></div><input type="number" step="0.01" min="0" value="${esc(p.price)}" placeholder="0.00" oninput="fld('price',this.value)"><p class="er" id="e_pr"></p>
      <div id="sz-sec">${sizesH()}</div></div>
    <div class="c"><div class="sec-h"><span class="num">5</span><div><h3>Colors</h3><p>Pick every colour you offer, or add your own.</p></div></div><div id="col-sec">${colorsH()}</div></div>

  <div class="ed-side"><div class="c" style="margin-top:0"><h3>Live preview <small style="color:#999;font-weight:400">hover for 2nd photo</small></h3><div id="pv-sec">${previewH()}</div></div>
    <div class="c"><h3>Listing quality</h3><div id="q-sec">${qualityH()}</div></div></div></div>`;

function photosH(){
  const p=ed;
  return`<div class="pts">${p.images.map((u,i)=>`<div class="pt${i?'':' cv'}" draggable="true" ondragstart="dragStart(event,${i})" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropPhoto(event,${i})">

  <div class="upload-bar-wrap" id="upload-bar-wrap"><div class="upload-bar"><div class="upload-bar-fill" id="upload-bar-fill"></div></div><div class="upload-label" id="upload-label">Uploading…</div></div>
  <p class="er" id="e_img"></p><p style="font-size:12px;color:#999">${p.images.length}/10 photos · JPG or PNG. Tip: 5+ photos from different angles sell better.</p>`;

function tagsH(){
  const k=ed.keywords;
  return`<div class="tag-input-wrap" onclick="$('#tag-inp').focus()">${k.map((kw,i)=>`<span class="tag-chip">${esc(kw)}<button onclick="event.stopPropagation();rmKw(${i})">×</button></span>`).join('')}<input class="tag-input" id="tag-inp" maxlength="20" placeholder="${k.length?'':'Add a tag…'}" onkeydown="tagKey(event)" onblur="addTag(this.value,1)"></div>
  <div class="tag-meta"><span>${k.length}/13 tags</span><span>Enter or comma to add</span></div>
  <div class="sugg">${SUGG.filter(s=>!k.some(x=>x.toLowerCase()==s)).slice(0,10).map(s=>`<button class="chip2" onclick="addTag(this.textContent)">${s}</button>`).join('')}</div>`;
}
function sizesH(){
  const p=ed;
  return`<div class="lbl2"><span>Sizes</span></div><div>${SZ.map(s=>`<button class="chip2 ${p.sizes.includes(s)?'on':''}" onclick="tg('sizes','${s}')">${s}</button>`).join('')}</div>
  <label style="display:block;margin-top:8px"><input type="checkbox" ${p.custom?'checked':''} onchange="fld('custom',this.checked);renderSizes()"> Offer custom size (customer DMs to order)</label><p class="er" id="e_sz"></p>`;
}
function colorsH(){
  const p=ed,cs=[...Object.keys(PC),...p.colors.filter(c=>!PC[c])];
  return`<div>${cs.map((c,i)=>`<button class="chip2 ${p.colors.includes(c)?'on':''}" onclick="togColor(${i})">${PC[c]?`<u style="background:${PC[c]}"></u>`:''}${esc(c)}</button>`).join('')}</div>
  <div class="flex" style="margin-top:8px"><input id="cc" placeholder="Other colour…" style="flex:1;max-width:260px" onkeydown="if(event.key=='Enter'){addc();event.preventDefault()}"><button class="btn-o btn-sm" onclick="addc()">Add</button></div>`;
}
function previewH(){
  const p=ed;
  return`<div class="pc pvw" style="box-shadow:none;border:1px solid #eee"><div class="pi"><img src="${esc(p.thumbs[0]||p.images[0]||'')}" alt="">${p.images[1]?`<img class="b" src="${esc(p.thumbs[1]||p.images[1])}" alt="">`:''}</div>
  <div class="bd"><b>${esc(p.title||'Jacket title')}</b><span class="pr">${money(p.price)}</span>${p.keywords.length?`<div class="tg">${p.keywords.slice(0,4).map(kw=>`<i class="kw-pill">${esc(kw)}</i>`).join('')}</div>`:''}</div></div>`;
}
function qualityH(){
  const p=ed,C=[[p.images.length>=1,'At least one photo',15],[p.images.length>=4,'4 or more photos',15],[p.title.trim().length>=25,'Descriptive title (25+ characters)',15],[p.desc.trim().length>=100,'Detailed description (100+ characters)',20],[p.keywords.length>=5,'5 or more tags',15],[+p.price>0,'Price set',10],[p.sizes.length>0||p.custom,'Sizes chosen',5],[p.colors.length>0,'Colour chosen',5]];
  const sc=C.reduce((a,c)=>a+(c[0]?c[2]:0),0),col=sc>=80?'#28a745':sc>=50?'#f0ad4e':'#dc3545';
  return`<div style="font-size:22px;font-weight:700">${sc}<small style="font-size:13px;color:#999;font-weight:400"> / 100</small></div><div class="meter"><div style="width:${sc}%;background:${col}"></div></div>${C.map(c=>`<div class="chk ${c[0]?'ok':''}"><span>${c[0]?'✓':'○'}</span>${c[1]}</div>`).join('')}`;
}
const renderPhotos=()=>{const e=$('#ph-sec');if(e)e.innerHTML=photosH()};
const renderTags=()=>{const e=$('#tags-sec');if(e){e.innerHTML=tagsH();const i=$('#tag-inp');if(i&&document.activeElement!==i&&!i._skip)i.focus()}};
const renderSizes=()=>{const e=$('#sz-sec');if(e)e.innerHTML=sizesH()};
const renderColors=()=>{const e=$('#col-sec');if(e)e.innerHTML=colorsH()};
const renderPreview=()=>{const e=$('#pv-sec');if(e)e.innerHTML=previewH()};
const renderQuality=()=>{const e=$('#q-sec');if(e)e.innerHTML=qualityH()};
function touch(){ed._d=1;renderPreview();renderQuality();draftSave()}
function fld(k,v){
  ed[k]=v;
  if(k=='title'){const e=$('#ti-count');if(e)e.textContent=v.length+'/80'}
  if(k=='desc'){const e=$('#de-count');if(e)e.textContent=v.length+' chars'}
  touch();
}
function tg(k,v){const a=ed[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);renderSizes();touch()}
function togColor(i){
  const p=ed,cs=[...Object.keys(PC),...p.colors.filter(c=>!PC[c])],c=cs[i],j=p.colors.indexOf(c);
  j<0?p.colors.push(c):p.colors.splice(j,1);renderColors();touch();
}
function addc(){const i=$('#cc'),v=i&&i.value.trim();if(v&&!ed.colors.some(c=>c.toLowerCase()==v.toLowerCase())){ed.colors.push(v);touch()}renderColors()}
function addTag(v,fromBlur){
  v=String(v||'').replace(/,/g,'').trim().slice(0,20);
  if(!v)return;
  if(ed.keywords.some(x=>x.toLowerCase()==v.toLowerCase()))return renderTags();
  if(ed.keywords.length>=13)return toast('Maximum 13 tags',1);
  ed.keywords.push(v);
  const i=$('#tag-inp');if(i&&fromBlur)i._skip=1;
  renderTags();touch();
}
function tagKey(e){
  if(e.key=='Enter'||e.key==','){e.preventDefault();const v=e.target.value;e.target.value='';addTag(v)}
  else if(e.key=='Backspace'&&!e.target.value&&ed.keywords.length){ed.keywords.pop();renderTags();touch()}
}
function rmKw(i){ed.keywords.splice(i,1);renderTags();touch()}
function mv(i,d){const j=i+d,p=ed;if(j<0||j>=p.images.length)return;[p.images[i],p.images[j]]=[p.images[j],p.images[i]];[p.thumbs[i],p.thumbs[j]]=[p.thumbs[j],p.thumbs[i]];renderPhotos();touch()}
function cover(i){const p=ed;p.images.unshift(p.images.splice(i,1)[0]);p.thumbs.unshift(p.thumbs.splice(i,1)[0]);renderPhotos();touch();toast('Cover photo changed')}
function rmI(i){ed.images.splice(i,1);ed.thumbs.splice(i,1);renderPhotos();touch()}
function cancel(){if(ed._d&&!confirm('Discard unsaved changes?'))return;if(!ed.id&&!confirm('Keep this as a draft for later?'))clearDraft();ed=null;rd()}
let dragIdx=null;
function dragStart(e,i){dragIdx=i;e.dataTransfer.effectAllowed='move'}
function dropPhoto(e,j){
  e.preventDefault();
  if(dragIdx===null||dragIdx===j){renderPhotos();return}
  const p=ed,img=p.images.splice(dragIdx,1)[0],thm=p.thumbs.splice(dragIdx,1)[0];
  p.images.splice(j,0,img);p.thumbs.splice(j,0,thm);dragIdx=null;renderPhotos();touch();
}

/* ---------- photo upload (single upload per photo, thumbnails via Cloudinary URL) ---------- */
const readFile=f=>new Promise((ok,no)=>{const x=new FileReader();x.onload=()=>ok(x.result);x.onerror=no;x.readAsDataURL(f)});
const shrink=(src,m,q,type='image/jpeg')=>new Promise((ok,no)=>{const i=new Image();i.onerror=()=>no(new Error('Could not read image'));i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(type,q))};i.src=src});
async function up(d){const r=await api('/api/admin/image','POST',{data:d});if(!r.url)throw new Error(r.error||'Upload error');return r.url}
function updateUploadBar(){
  const f=$('#upload-bar-fill'),l=$('#upload-label'),w=$('#upload-bar-wrap');
  if(w)w.classList.toggle('show',uplTotal>0);
  if(f)f.style.width=(uplTotal?Math.round(uplDone/uplTotal*100):0)+'%';
  if(l)l.textContent=`Uploading ${Math.min(uplDone+1,uplTotal)} of ${uplTotal}…`;
}
async function ph(fs){
  const E=ed;if(!E)return;
  fs=[...fs].filter(f=>f.type.startsWith('image/'));
  const room=10-E.images.length;
  if(fs.length>room){toast('Maximum 10 photos per listing',1);fs=fs.slice(0,room)}
  if(!fs.length)return;
  uplTotal=fs.length;uplDone=0;updateUploadBar();
  const res=new Array(fs.length);let next=0,failed=0,err='';
  const worker=async()=>{while(next<fs.length){const i=next++;try{res[i]=await up(await shrink(await readFile(fs[i]),1400,.82))}catch(e){failed++;err=e.message||String(e)}uplDone++;updateUploadBar()}};
  await Promise.all([worker(),worker(),worker()]);
  res.forEach(u=>{if(u){E.images.push(u);E.thumbs.push(thumbOf(u))}});
  uplTotal=0;uplDone=0;
  if(ed===E){renderPhotos();touch()}
  failed?toast(`${failed} photo(s) failed: ${err}`,1):toast(`${fs.length} photo(s) uploaded`);
}

/* ---------- save ---------- */
async function saveP(){
  const p=ed,E={};
  if(!p.images.length)E.img='Add at least one photo.';
  if(!p.title.trim())E.ti='Title is required.';
  if(!(+p.price>0))E.pr='Enter a price above 0.';
  if(!p.sizes.length&&!p.custom)E.sz='Pick at least one size, or allow custom size.';
  ['img','ti','pr','sz'].forEach(k=>{const e=$('#e_'+k);if(e)e.textContent=E[k]||''});
  const first=Object.keys(E)[0];
  if(first){setTimeout(()=>{const e=$('#e_'+first);if(e)e.scrollIntoView({block:'center',behavior:'smooth'})},50);return toast(E[first],1)}
  if(uplTotal)return toast('Wait for photos to finish uploading',1);
  const b=$('#sv');if(b){b.disabled=true;b.textContent='Saving…'}
  try{
    const r=await api('/api/admin/product','POST',{id:p.id,title:p.title.trim(),desc:p.desc,price:+(+p.price).toFixed(2),cat:p.cat,season:p.season,sizes:SZ.filter(s=>p.sizes.includes(s)),custom:p.custom,colors:p.colors,images:p.images,thumbs:p.thumbs,keywords:p.keywords||[]});
    if(r.error)throw new Error(r.error);
    const was=p.id;ed=null;clearDraft();await refresh(true);toast(was?'Changes saved':'Listing published 🎉');
  }catch(e){if(b){b.disabled=false;b.textContent='Try again'}toast('Could not save: '+(e.message||'check your connection'),1)}
}
function editP(id,copy){
  const p=D.products.find(x=>x.id==id);if(!p)return;
  const im=[...(p.images||[])];
  ed={...p,desc:p.desc||'',sizes:[...(p.sizes||[])],colors:[...(p.colors||[])],images:im,thumbs:im.map((u,i)=>(p.thumbs||[])[i]||thumbOf(u)),custom:p.custom!==false,keywords:[...(p.keywords||[])]};
  if(copy){delete ed.id;ed.title+=' (copy)';ed._d=1}
  rd();scrollTo(0,0);
}
async function del(id){
  if(!confirm('Delete this listing? This cannot be undone.'))return;
  try{await api('/api/admin/product/'+id,'DELETE');await refresh(true);toast('Listing deleted')}catch(e){toast('Could not delete',1)}
}

/* ---------- sales ---------- */
async function sset(){
  const pct=Math.min(90,Math.max(0,+$('#sp').value||0));
  await api('/api/admin/settings','POST',{...D.settings,saleActive:$('#sa').checked,salePercent:pct,saleLabel:$('#sl').value,banner:$('#bn').value,specialBtn:{on:$('#bo').checked,text:$('#bt').value,code:$('#bc').value}});
  await refresh(true);toast('Sale settings saved');
}
async function sdc(){
  const c=$('#dc')?.value.trim(),p=$('#dp')?.value;
  if(!c||!p)return toast('Enter code and percentage',1);
  await api('/api/admin/discount','POST',{code:c,pct:p});await refresh(true);toast('Promo code added');
}
async function togDisc(code){const d=D.discounts.find(x=>x.code==code);if(!d)return;await api('/api/admin/discount','POST',{code:d.code,pct:d.pct,active:!d.active});await refresh(true)}
async function delDisc(code){if(!confirm('Delete code '+code+'?'))return;await api('/api/admin/discount/'+encodeURIComponent(code),'DELETE');await refresh(true)}
async function sendRem(){const r=await api('/api/admin/reminders','POST',{});toast((r.sent||0)+' reminder(s) sent');await refresh(true)}

/* ---------- categories ---------- */
async function upInto(id,inp,png){
  const f=inp.files[0];inp.value='';if(!f)return;toast('Uploading…');
  try{const u=await up(await shrink(await readFile(f),1600,.86,png?'image/png':'image/jpeg'));$('#'+id).value=u;if(typeof ssPreview=='function')ssPreview();toast('Uploaded')}
  catch(e){toast('Upload failed: '+(e.message||e),1)}
}
function addCat(){
  const key=$('#cat-key')?.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,''),label=$('#cat-label')?.value.trim(),img=$('#cat-img')?.value.trim();
  if(!key||!label)return toast('Key and label are required',1);
  CL[key]=label;const ci={...(D.settings.categoryImages||{})};if(img)ci[key]=img;saveCats(ci);
}
function editCat(k){
  const label=prompt('Category label:',CL[k]);if(!label)return;
  const old=catImg(k),img=prompt('Image URL (blank keeps current):',old)||old;
  CL[k]=label;const ci={...(D.settings.categoryImages||{})};if(img)ci[k]=img;saveCats(ci);
}
function delCat(k){
  if(!confirm('Delete this category? Products using it keep their old category value.'))return;
  delete CL[k];const ci={...(D.settings.categoryImages||{})};delete ci[k];saveCats(ci);
}
async function saveCats(ci){await api('/api/admin/settings','POST',{...D.settings,categories:CL,categoryImages:ci});await refresh(true);toast('Categories saved')}

/* ---------- store settings ---------- */
function ssPreview(){
  const logo=$('#ss-logo')?.value||'',bg=$('#ss-bg')?.value||'',lp=$('#ss-logo-pv'),bp=$('#ss-bg-pv');
  if(lp)lp.innerHTML=logo?`<img src="${esc(logo)}" alt="Logo">`:'<span style="color:#999;font-size:13px">No logo set</span>';
  if(bp)bp.innerHTML=bg?`<img src="${esc(bg)}" alt="Banner" style="max-width:400px;max-height:200px">`:'<span style="color:#999;font-size:13px">No image set</span>';
}
async function saveStoreSettings(){
  const s=D.settings;
  await api('/api/admin/settings','POST',{...s,storeName:$('#ss-name').value,logoUrl:$('#ss-logo').value,backgroundUrl:$('#ss-bg').value,heroBg:$('#ss-bg').value,heroHeading:$('#ss-h1').value,heroSubheading:$('#ss-h2').value,footer:{...(s.footer||{}),about:$('#ss-about').value,email:$('#ss-mail').value,whatsapp:$('#ss-wa').value}});
  await refresh(true);toast('Store settings saved');
}
const _draw=draw;draw=function(){_draw();if(tab=='storesettings')ssPreview()};

/* ---------- auto refresh: only when idle, only if data changed ---------- */
setInterval(()=>{
  if(!T||document.hidden||ed||uplTotal||!['home','orders','chat','refunds'].includes(tab))return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
  refresh();
},8000);
window.addEventListener('beforeunload',e=>{if(ed&&ed._d){e.preventDefault();e.returnValue=''}});
T?(showLoading(),refresh(true)):login();
</script></body></html>
